name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, json, openssl, mbstring
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate composer
        run: composer validate --strict

      - name: Check code style
        run: composer lint:test

      - name: Run static analysis
        run: composer analyse

      - name: Run tests
        run: composer test

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          # Pinned deliberately. Unpinned, npm resolved a preset that wants
          # conventional-changelog-writer@9 while the action bundles 8, and the
          # release died on a missing Handlebars helper. A release pipeline that
          # depends on whatever npm resolved that morning is not a pipeline.
          extra_plugins: |
            conventional-changelog-conventionalcommits@8.0.0
            @semantic-release/changelog@6.0.3
            @semantic-release/git@10.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
